<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="영어로 대화하고 자연스러운 표현을 연습하는 AI 영어 학습 챗봇"
    />
    <title>Fluent — English practice</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="학습 메뉴">
        <a class="brand" href="/" aria-label="Fluent 홈">
          <span class="brand-mark">F</span>
          <span>fluent<span class="brand-dot">.</span></span>
        </a>

        <nav class="nav-list" aria-label="주요 메뉴">
          <a class="nav-item active" href="#chat" aria-current="page">
            <span class="nav-icon" aria-hidden="true">⌁</span> Practice
          </a>
          <a class="nav-item" href="#progress">
            <span class="nav-icon" aria-hidden="true">↗</span> Progress
          </a>
          <a class="nav-item" href="#vocabulary">
            <span class="nav-icon" aria-hidden="true">◇</span> Vocabulary
          </a>
        </nav>

        <div class="streak-card">
          <div class="streak-top">
            <span class="eyebrow">THIS WEEK</span>
            <span class="streak-count">3 day streak</span>
          </div>
          <div class="week-row" aria-label="이번 주 학습 현황">
            <span class="day done">M</span>
            <span class="day done">T</span>
            <span class="day current">W</span>
            <span class="day">T</span>
            <span class="day">F</span>
          </div>
        </div>

        <button class="profile" type="button">
          <span class="avatar">JL</span>
          <span><strong>Jay learner</strong><small>Intermediate</small></span>
          <span class="profile-more" aria-hidden="true">•••</span>
        </button>
      </aside>

      <main class="chat-page" id="chat">
        <header class="topbar">
          <button class="mobile-menu" type="button" aria-label="메뉴 열기">☰</button>
          <div>
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text">TUTOR ONLINE</span>
          </div>
          <button class="level-button" type="button" aria-label="현재 난이도: 중급">
            Intermediate <span aria-hidden="true">⌄</span>
          </button>
        </header>

        <section class="conversation" aria-label="영어 회화">
          <div class="lesson-heading">
            <span class="lesson-number">DAILY ENGLISH</span>
            <h1>오늘의 영어를 만나보세요.</h1>
            <p>궁금한 영어 단어나 문장을 입력하면 바로 분석해 드려요.</p>
          </div>

          <div class="messages" id="messages" aria-live="polite">
            <article class="message-row tutor-message" id="welcome-loading">
              <div class="tutor-avatar" aria-hidden="true">F</div>
              <div>
                <span class="speaker">FLUENT TUTOR</span>
                <div class="bubble tutor-bubble" aria-label="오늘의 학습 내용을 불러오는 중">
                  <span class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
                </div>
              </div>
            </article>
          </div>
        </section>

        <form class="composer" id="chat-form">
          <div class="composer-box">
            <label class="sr-only" for="message-input">영어 메시지</label>
            <textarea
              id="message-input"
              name="message"
              rows="1"
              maxlength="2000"
              placeholder="영어 단어나 문장을 입력해 보세요..."
              required
            ></textarea>
            <div class="composer-actions">
              <span class="input-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for new line</span>
              <button class="send-button" type="submit" aria-label="메시지 보내기">
                <span>Send</span><span aria-hidden="true">↑</span>
              </button>
            </div>
          </div>
          <p class="disclaimer">AI가 제공한 교정은 정확하지 않을 수 있어요.</p>
        </form>
      </main>

      <aside class="insight-panel" aria-label="오늘의 학습 정보">
        <div class="insight-header">
          <span class="eyebrow">TODAY'S ENGLISH</span>
          <strong>오늘의 학습</strong>
        </div>

        <div class="daily-word-list" id="daily-word-list" aria-label="오늘의 단어">
          <div class="side-loading"></div>
          <div class="side-loading short"></div>
        </div>

        <blockquote class="phrase-card" id="weekly-sentence">
          <span class="eyebrow">THIS WEEK'S SENTENCE</span>
          <p>불러오는 중...</p>
          <small></small>
        </blockquote>
      </aside>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
